services:
  - type: web
    name: rekroot-server
    runtime: node
    rootDir: SERVER
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://rekrootai.vercel.app
      - key: ML_SERVICE_URL
        sync: false
      - key: ML_SERVICE_TOKEN
        sync: false
